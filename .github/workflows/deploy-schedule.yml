# .github/workflows/deploy-schedule.yml
name: 更新上下班时间并部署到GitHub Pages

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests

      - name: 运行脚本获取上下班时间并生成 index.html
        env:
          REAL_API_URL: ${{ secrets.REAL_API_URL }}
          ISSCLOCK_CLIENT_TOKEN: ${{ secrets.ISSCLOCK_CLIENT_TOKEN }}
          COOKIE: ${{ secrets.COOKIE }}
        run: python fetch_schedule.py

      - name: 上传静态文件作为 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
