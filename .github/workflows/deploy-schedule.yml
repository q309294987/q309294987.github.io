# .github/workflows/deploy-schedule.yml
name: 更新上下班时间并部署到GitHub Pages

on:
  schedule:
    # 每天 UTC 时间 1:00 运行 = 北京时间 9:00
    - cron: '0 1 * * *'
  # 允许手动触发，便于测试
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以便能推送到 gh-pages 分支
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests

      - name: 运行脚本获取上下班时间并生成 index.html
        run: python fetch_schedule.py
        # 如果有 API 密钥，可以取消下面的注释并在 GitHub Secrets 中配置
        # env:
        #   API_KEY: ${{ secrets.API_KEY }}

      - name: 上传静态文件作为 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
